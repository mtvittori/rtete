[package]
name = "rtete"
version = "0.1.0"
edition = "2021"

[dependencies]
grammers-client = "0.11.0"
grammers-session = { version = "0.11.0", default-features = false, features = ["sqlite-storage"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net", "process", "sync", "time", "fs"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
png = { version = "0.18", default-features = false }
base64 = "0.22"
md5 = "0.8"
rpassword = "7"
jiff = "0.2.38"
icy_sixel = "0.7.0"
iced = { version = "0.14", optional = true, default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "tokio", "image", "advanced", "thread-pool", "fira-sans"] }

[features]
gui = ["dep:iced"]

[[bin]]
name = "rtete"
path = "src/main.rs"

[[bin]]
name = "rtete-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
